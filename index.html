<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gig Setlist Logger</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: {
                            bg: '#0f172a',
                            card: '#1e293b',
                            border: '#334155',
                            text: '#f8fafc',
                            muted: '#94a3b8'
                        }
                    }
                }
            }
        }
    </script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased selection:bg-indigo-500 selection:text-white">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const DEFAULT_SONGS = [
            { id: '1', title: 'Midnight Runner', firstLine: 'Walking down the neon avenue', chorus: 'Run into the dark night', played: false, playedAt: null, isTbc: false, notes: '' },
            { id: '2', title: 'Electric Whispers', firstLine: 'Static on the radio tonight', chorus: 'Hear the electric whispers call', played: false, playedAt: null, isTbc: false, notes: '' },
            { id: '3', title: 'Silver Horizon', firstLine: 'Looking out across the ocean grey', chorus: 'Towards the silver horizon we go', played: false, playedAt: null, isTbc: false, notes: '' },
            { id: '4', title: 'Shadows in the Alley', firstLine: 'Footsteps echoing behind the wall', chorus: 'Just shadows playing in the alley', played: false, playedAt: null, isTbc: false, notes: '' },
            { id: '5', title: 'Neon Pulse', firstLine: 'Heartbeat matching with the bassline', chorus: 'Feel the neon pulse alive', played: false, playedAt: null, isTbc: false, notes: '' },
            { id: '6', title: 'Starlight Parade', firstLine: 'Dust off your dancing shoes', chorus: 'Underneath the starlight parade', played: false, playedAt: null, isTbc: false, notes: '' },
            { id: '7', title: 'Broken Compass', firstLine: 'Lost direction somewhere in the rain', chorus: 'Follow a broken compass home', played: false, playedAt: null, isTbc: false, notes: '' },
            { id: '8', title: 'Rebel Youth', firstLine: 'We had fire burning in our eyes', chorus: 'Forever stay young and wild', played: false, playedAt: null, isTbc: false, notes: '' },
            { id: '9', title: 'Cosmic Drift', firstLine: 'Floating far above the stratosphere', chorus: 'Lost in a cosmic drift', played: false, playedAt: null, isTbc: false, notes: '' },
            { id: '10', title: 'Echoes of Tomorrow', firstLine: 'Yesterday is fading fast away', chorus: 'Listening to echoes of tomorrow', played: false, playedAt: null, isTbc: false, notes: '' }
        ];

        function App() {
            const [songs, setSongs] = useState(() => {
                const saved = localStorage.getItem('gig_songs_v1');
                return saved ? JSON.parse(saved) : DEFAULT_SONGS;
            });

            const [searchQuery, setSearchQuery] = useState('');
            const [activeTab, setActiveTab] = useState('pool');
            
            const [showAddModal, setShowAddModal] = useState(false);
            const [newTitle, setNewTitle] = useState('');
            const [newFirstLine, setNewFirstLine] = useState('');
            const [newChorus, setNewChorus] = useState('');
            const [newNotes, setNewNotes] = useState('');

            const [editingSong, setEditingSong] = useState(null);

            useEffect(() => {
                localStorage.setItem('gig_songs_v1', JSON.stringify(songs));
            }, [songs]);

            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            });

            const toggleSongPlayed = (id) => {
                const now = new Date();
                const timeString = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

                setSongs(songs.map(song => {
                    if (song.id === id) {
                        const nextPlayed = !song.played;
                        return {
                            ...song,
                            played: nextPlayed,
                            playedAt: nextPlayed ? (song.playedAt || timeString) : null
                        };
                    }
                    return song;
                }));
            };

            const handleAddTbcSong = (e) => {
                e.preventDefault();
                const now = new Date();
                const timeString = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

                const newSong = {
                    id: 'tbc_' + Date.now(),
                    title: newTitle.trim() || 'TBC Song',
                    firstLine: newFirstLine.trim(),
                    chorus: newChorus.trim(),
                    played: true,
                    playedAt: timeString,
                    isTbc: !newTitle.trim() || newTitle.toLowerCase().includes('tbc'),
                    notes: newNotes.trim()
                };

                setSongs([newSong, ...songs]);
                setNewTitle('');
                setNewFirstLine('');
                setNewChorus('');
                setNewNotes('');
                setShowAddModal(false);
                setActiveTab('setlist');
            };

            const handleSaveEdit = (e) => {
                e.preventDefault();
                setSongs(songs.map(s => s.id === editingSong.id ? editingSong : s));
                setEditingSong(null);
            };

            const handleResetSetlist = () => {
                if (window.confirm("Reset the gig setlist? This will uncheck all songs.")) {
                    setSongs(songs.map(s => ({ ...s, played: false, playedAt: null })));
                }
            };

            const handleExport = () => {
                const playedSongs = songs.filter(s => s.played);
                let text = "GIG SETLIST\n===========\n\n";
                playedSongs.forEach((s, idx) => {
                    text += (idx + 1) + ". [" + (s.playedAt || 'Live') + "] " + s.title + (s.isTbc ? ' (TBC)' : '') + "\n";
                    if (s.firstLine) text += '   1st Line: "' + s.firstLine + '"\n';
                    if (s.chorus) text += '   Chorus: "' + s.chorus + '"\n';
                    if (s.notes) text += '   Notes: ' + s.notes + '\n';
                    text += '\n';
                });

                const blob = new Blob([text], { type: 'text/plain' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'gig-setlist.txt';
                a.click();
            };

            const filteredSongs = songs.filter(song => {
                const query = searchQuery.toLowerCase();
                return (
                    song.title.toLowerCase().includes(query) ||
                    (song.firstLine && song.firstLine.toLowerCase().includes(query)) ||
                    (song.chorus && song.chorus.toLowerCase().includes(query)) ||
                    (song.notes && song.notes.toLowerCase().includes(query))
                );
            });

            const playedSongsList = songs.filter(s => s.played);

            return (
                <div className="min-h-screen bg-slate-950 text-slate-100 flex flex-col">
                    <header className="bg-slate-900 border-b border-slate-800 sticky top-0 z-30 shadow-md">
                        <div className="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
                            <div className="flex items-center space-x-3">
                                <div className="bg-indigo-600 p-2 rounded-xl text-white shadow-lg shadow-indigo-500/30">
                                    <i data-lucide="music" className="w-6 h-6"></i>
                                </div>
                                <div>
                                    <h1 className="text-lg font-bold tracking-tight text-white flex items-center gap-2">
                                        Gig Setlist Logger 
                                        <span className="text-xs font-semibold px-2 py-0.5 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">Live</span>
                                    </h1>
                                    <p className="text-xs text-slate-400">Tap checkboxes as songs play</p>
                                </div>
                            </div>

                            <button 
                                onClick={() => setShowAddModal(true)}
                                className="flex items-center space-x-1.5 bg-indigo-600 hover:bg-indigo-500 text-white text-xs sm:text-sm font-medium px-3 py-2 rounded-lg transition-all shadow-md"
                            >
                                <i data-lucide="plus" className="w-4 h-4"></i>
                                <span>Add TBC</span>
                            </button>
                        </div>
                    </header>

                    <div className="bg-slate-900/60 border-b border-slate-800 backdrop-blur sticky top-[57px] z-20">
                        <div className="max-w-4xl mx-auto px-4 flex justify-between items-center">
                            <div className="flex space-x-2 py-2">
                                <button
                                    onClick={() => setActiveTab('pool')}
                                    className={`px-4 py-2 rounded-lg text-sm font-medium transition-all flex items-center space-x-2 ${
                                        activeTab === 'pool' ? 'bg-slate-800 text-white border border-slate-700' : 'text-slate-400 hover:text-white'
                                    }`}
                                >
                                    <i data-lucide="list-music" className="w-4 h-4"></i>
                                    <span>Song Pool ({songs.length})</span>
                                </button>
                                <button
                                    onClick={() => setActiveTab('setlist')}
                                    className={`px-4 py-2 rounded-lg text-sm font-medium transition-all flex items-center space-x-2 ${
                                        activeTab === 'setlist' ? 'bg-slate-800 text-white border border-slate-700' : 'text-slate-400 hover:text-white'
                                    }`}
                                >
                                    <i data-lucide="check-square" className="w-4 h-4"></i>
                                    <span>Live Setlist ({playedSongsList.length})</span>
                                </button>
                            </div>

                            {playedSongsList.length > 0 && (
                                <div className="flex items-center space-x-2">
                                    <button onClick={handleExport} className="p-2 text-slate-400 hover:text-white rounded-lg text-xs flex items-center gap-1">
                                        <i data-lucide="download" className="w-4 h-4"></i>
                                    </button>
                                    <button onClick={handleResetSetlist} className="p-2 text-rose-400 hover:text-rose-300 rounded-lg text-xs">
                                        <i data-lucide="rotate-ccw" className="w-4 h-4"></i>
                                    </button>
                                </div>
                            )}
                        </div>
                    </div>

                    <main className="max-w-4xl mx-auto px-4 py-6 flex-1 w-full">
                        {activeTab === 'pool' && (
                            <div className="space-y-4">
                                <div className="relative">
                                    <span className="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                                        <i data-lucide="search" className="w-4 h-4"></i>
                                    </span>
                                    <input
                                        type="text"
                                        placeholder="Search songs, first line, chorus..."
                                        value={searchQuery}
                                        onChange={(e) => setSearchQuery(e.target.value)}
                                        className="w-full bg-slate-900 border border-slate-800 rounded-xl pl-10 pr-4 py-3 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500"
                                    />
                                </div>

                                <div className="space-y-2.5">
                                    {filteredSongs.map((song) => (
                                        <div 
                                            key={song.id}
                                            className={`group bg-slate-900/90 border rounded-xl p-4 flex items-start gap-3.5 ${
                                                song.played ? 'border-indigo-500/40 bg-indigo-950/10' : 'border-slate-800'
                                            }`}
                                        >
                                            <div className="pt-0.5">
                                                <input
                                                    type="checkbox"
                                                    checked={song.played}
                                                    onChange={() => toggleSongPlayed(song.id)}
                                                    className="w-5 h-5 accent-indigo-600 rounded bg-slate-800 border-slate-700 cursor-pointer"
                                                />
                                            </div>
                                            <div className="flex-1 min-w-0">
                                                <div className="flex items-center justify-between gap-2">
                                                    <div className="flex items-center gap-2">
                                                        <h2 className={`font-semibold text-base truncate ${song.played ? 'text-indigo-300' : 'text-slate-200'}`}>
                                                            {song.title}
                                                        </h2>
                                                        {song.isTbc && (
                                                            <span className="bg-amber-500/10 text-amber-400 text-[10px] font-bold px-2 py-0.5 rounded-md">TBC</span>
                                                        )}
                                                        {song.played && song.playedAt && (
                                                            <span className="bg-indigo-500/20 text-indigo-300 text-[11px] px-2 py-0.5 rounded">{song.playedAt}</span>
                                                        )}
                                                    </div>
                                                    <button onClick={() => setEditingSong(song)} className="text-slate-500 hover:text-slate-300 p-1">
                                                        <i data-lucide="edit-3" className="w-4 h-4"></i>
                                                    </button>
                                                </div>
                                                <div className="mt-2 grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs">
                                                    {song.firstLine && (
                                                        <div className="bg-slate-950/40 rounded-lg p-2 border border-slate-800/60">
                                                            <span className="text-slate-500 block text-[10px] uppercase">First Line</span>
                                                            <span className="text-slate-300 italic">"{song.firstLine}"</span>
                                                        </div>
                                                    )}
                                                    {song.chorus && (
                                                        <div className="bg-slate-950/40 rounded-lg p-2 border border-slate-800/60">
                                                            <span className="text-slate-500 block text-[10px] uppercase">Chorus</span>
                                                            <span className="text-slate-300 italic">"{song.chorus}"</span>
                                                        </div>
                                                    )}
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {activeTab === 'setlist' && (
                            <div className="space-y-4">
                                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4">
                                    <h2 className="text-base font-bold text-white mb-4">Running Order</h2>
                                    {playedSongsList.length === 0 ? (
                                        <p className="text-center text-slate-500 py-12">No songs checked off yet tonight.</p>
                                    ) : (
                                        <div className="space-y-3">
                                            {playedSongsList.map((song, index) => (
                                                <div key={song.id} className="flex items-center justify-between bg-slate-950/60 border border-slate-800 p-3.5 rounded-xl">
                                                    <div className="flex items-center space-x-3.5">
                                                        <span className="w-7 h-7 rounded-lg bg-indigo-600/20 text-indigo-400 flex items-center justify-center text-xs font-bold">{index + 1}</span>
                                                        <div>
                                                            <h3 className="font-semibold text-sm text-slate-100">{song.title}</h3>
                                                            <p className="text-xs text-slate-400">"{song.firstLine || song.chorus || song.notes}"</p>
                                                        </div>
                                                    </div>
                                                    <span className="text-xs font-mono text-indigo-300">{song.playedAt}</span>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}
                    </main>

                    {showAddModal && (
                        <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-6 shadow-2xl">
                                <h3 className="text-base font-bold text-white mb-4">Add Unrecognized Song (TBC)</h3>
                                <form onSubmit={handleAddTbcSong} className="space-y-3">
                                    <input type="text" placeholder="Title or TBC name" value={newTitle} onChange={e => setNewTitle(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-slate-100" />
                                    <input type="text" placeholder="First line..." value={newFirstLine} onChange={e => setNewFirstLine(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-slate-100" />
                                    <input type="text" placeholder="Chorus words..." value={newChorus} onChange={e => setNewChorus(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-slate-100" />
                                    <textarea placeholder="Notes..." value={newNotes} onChange={e => setNewNotes(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-slate-100 resize-none" rows="2"></textarea>
                                    <div className="flex justify-end space-x-2 pt-2">
                                        <button type="button" onClick={() => setShowAddModal(false)} className="px-4 py-2 text-sm text-slate-400">Cancel</button>
                                        <button type="submit" className="px-4 py-2 bg-indigo-600 text-white rounded-xl text-sm">Add & Log</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {editingSong && (
                        <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-6 shadow-2xl">
                                <h3 className="text-base font-bold text-white mb-4">Edit Song</h3>
                                <form onSubmit={handleSaveEdit} className="space-y-3">
                                    <input type="text" value={editingSong.title} onChange={e => setEditingSong({...editingSong, title: e.target.value})} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-slate-100" />
                                    <input type="text" value={editingSong.firstLine || ''} onChange={e => setEditingSong({...editingSong, firstLine: e.target.value})} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-slate-100" />
                                    <input type="text" value={editingSong.chorus || ''} onChange={e => setEditingSong({...editingSong, chorus: e.target.value})} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-slate-100" />
                                    <div className="flex justify-end space-x-2 pt-2">
                                        <button type="button" onClick={() => setEditingSong(null)} className="px-4 py-2 text-sm text-slate-400">Cancel</button>
                                        <button type="submit" className="px-4 py-2 bg-indigo-600 text-white rounded-xl text-sm">Save</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
